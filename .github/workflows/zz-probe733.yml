name: zz733
on:
  push:
    branches: [ "zz-probe733" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: prep
        run: pip install websocket-client==1.9.2 brotli 2>&1 | tail -2
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' > probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo 'RCIsZCkKYWZ0ZXI9bW9ubWFwKCkKbG9nKCJNT05fQUZURVIiLCBqc29uLmR1bXBzKHtrOih2LmdldCgibmFtZSIpLHYuZ2V0KCJ0eXBlIikpIGZvciBrLHYgaW4gYWZ0ZXIuaXRlbXMoKX0pWzo4MDBdKQpvcGVuKCJyNzMzLnR4dCIsInciKS53cml0ZSgiXG4iLmpvaW4oT1VUKSkK' >> probe.b64
      - name: run
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          timeout 1500 python3 probe.py > r733.txt 2>&1
          echo exit=$?
          wc -c r733.txt
      - name: push
        if: always()
        run: |
          set +e
          git config user.email p@e.com; git config user.name p
          git checkout -B zz-out733
          git add -A -f .
          git commit -m out733
          git push -f origin zz-out733 2>&1 | tail -5
