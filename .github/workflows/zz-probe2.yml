name: zz-probe2
on:
  push:
    branches: [ "zz-probe2" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
      - name: run-probe
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > result.txt 2>&1
          wc -c result.txt
          head -c 200 result.txt
      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: result.txt
      - name: push-back
        if: always()
        run: |
          set +e
          git config user.email "probe@example.com"
          git config user.name "probe"
          cp result.txt zz-result.txt 2>/dev/null
          git checkout -B zz-out
          git add -f zz-result.txt
          git commit -m "probe result"
          git push -f origin zz-out
          echo push-exit=$?
