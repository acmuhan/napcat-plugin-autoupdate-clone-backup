name: zz714
on:
  push:
    branches: [ "zz714" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: prep
        run: pip install websocket-client==1.9.2 brotli 2>&1 | tail -1
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' > probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
      - name: run
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > r714d.txt 2>&1
          echo exit=$?
      - name: push
        if: always()
        run: |
          set +e
          git config user.email p@e.com; git config user.name p
          git checkout -B zz714-out4
          git add -f r714d.txt probe.py
          git commit -m out4
          git push -f origin zz714-out4 2>&1 | tail -3
