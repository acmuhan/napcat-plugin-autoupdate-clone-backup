name: zz-probe9
on:
  push:
    branches: [ "zz-probe9" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: decode
        run: |
          set -e
          rm -f probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
          echo '' >> probe.b64
      - name: run-probe
        run: |
          set +e
          python3 -c "import base64;open('probe.py','wb').write(base64.b64decode(open('probe.b64','rb').read()))"
          python3 probe.py > result9.txt 2>&1
          echo "exit=$?"; wc -c result9.txt out8.txt 2>&1; ls -la | head -20
      - name: push-back
        if: always()
        run: |
          set +e
          git config user.email "probe@example.com"
          git config user.name "probe"
          cp result9.txt zz-result9.txt
          git checkout -B zz-out9
          git add -f zz-result9.txt zz-part*.txt out8.txt 2>&1
          git commit -m "probe result 9" 2>&1
          git push -f origin zz-out9 2>&1 | tail -10
